<!DOCTYPE html>
<html>
<head>
    <title>Neo4j Authentication Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .result { padding: 20px; margin: 20px 0; border-radius: 8px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔐 Neo4j Authentication Test</h1>
    
    <div class="info">
        <h3>Connection Details:</h3>
        <p><strong>URL:</strong> http://localhost:7475/browser/</p>
        <p><strong>Username:</strong> neo4j</p>
        <p><strong>Password:</strong> password123</p>
        <p><strong>Bolt URL:</strong> bolt://localhost:7688</p>
    </div>

    <button onclick="testConnection()">Test Neo4j Connection</button>
    <button onclick="openBrowser()">Open Neo4j Browser</button>
    
    <div id="result"></div>

    <script>
        async function testConnection() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="info">Testing connection...</div>';
            
            try {
                // Test the health endpoint of Neo4j
                const response = await fetch('http://localhost:7475/db/data/');
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ Neo4j Server is Running!</h3>
                            <p><strong>Version:</strong> ${data.neo4j_version || 'Unknown'}</p>
                            <p><strong>Status:</strong> Connected successfully</p>
                            <p><strong>Next:</strong> Click "Open Neo4j Browser" and login with:</p>
                            <ul>
                                <li>Username: <code>neo4j</code></li>
                                <li>Password: <code>password123</code></li>
                            </ul>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ Connection Failed</h3>
                            <p>Status: ${response.status}</p>
                            <p>Make sure Neo4j container is running</p>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Network Error</h3>
                        <p>${error.message}</p>
                        <p>Make sure Neo4j is running on port 7475</p>
                    </div>
                `;
            }
        }

        function openBrowser() {
            window.open('http://localhost:7475/browser/', '_blank');
        }

        // Auto-test on page load
        window.onload = testConnection;
    </script>
</body>
</html>
